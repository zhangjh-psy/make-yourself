appId: com.makeyourself.app
productName: Make yourself
# 可执行文件名不能带空格（便携版自解压路径会出问题），所以显示名和 exe 名分开
executableName: MakeYourself
copyright: Copyright © 2026 ZHANG Junhui (zhangjh-psy)

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: build/icon.ico
    to: build/icon.ico
  - from: build/icon.32.png
    to: build/icon.32.png

asar: true
# 最高压缩。原因：GitHub Release 单个附件上限 100 MB，
# 用 normal 打出来的安装包有 106 MB，传不上去。代价只是打包慢一点。
compression: maximum

# 只保留中文语言包。
# Electron 自带 55 种语言的翻译文件，加起来约 48 MB，
# 而这个应用界面只提供中文，其余 54 种纯属白占体积。
# 以后要做多语言，把 "en-US" 之类的加进来即可。
electronLanguages:
  - zh-CN
  - zh-TW
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
  artifactName: MakeYourself-便携版-${version}.${ext}

portable:
  artifactName: MakeYourself-便携版-${version}.${ext}
  splashImage: null

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Make yourself
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: MakeYourself-安装版-${version}.${ext}
